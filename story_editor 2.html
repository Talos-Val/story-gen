<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&family=DM+Sans:wght@300;400;600&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #2a2a2a;
    --accent: #e8ff47;
    --text: #f0f0f0;
    --muted: #555;
    --phone-w: 320px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.2rem;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .subtitle {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 40px;
  }

  .workspace {
    display: flex;
    gap: 48px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* ── Phone mockup ── */
  .phone {
    width: var(--phone-w);
    background: #000;
    border-radius: 40px;
    border: 2px solid #2a2a2a;
    box-shadow: 0 0 0 1px #111, 0 40px 80px rgba(0,0,0,.8);
    overflow: hidden;
    flex-shrink: 0;
  }

  .phone-bar {
    background: #000;
    padding: 12px 20px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.7rem;
    color: #ccc;
  }

  .insta-header {
    background: #000;
    padding: 8px 14px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #1a1a1a;
  }

  .insta-logo {
    font-family: 'DM Sans', sans-serif;
    font-size: 1.2rem;
    font-style: italic;
    font-weight: 600;
    letter-spacing: -0.5px;
  }

  .insta-icons { display: flex; gap: 14px; align-items: center; }

  .story-strip {
    background: #000;
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid #111;
  }

  .avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }

  .highlights-strip {
    background: #000;
    padding: 8px 12px 10px;
    border-bottom: 1px solid #111;
  }

  .hl-label { font-size: 0.62rem; color: #ccc; margin-bottom: 6px; }
  .hl-circles { display: flex; gap: 10px; }
  .hl-circle {
    width: 50px; height: 50px; border-radius: 50%;
    background: #222; border: 1.5px solid #333;
  }

  /* ── The big image area ── */
  .post-area {
    position: relative;
    width: 100%;
    aspect-ratio: 4/5;
    background: #1a1a1a;
    overflow: hidden;
    cursor: pointer;
  }

  .post-area img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .drop-hint {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    color: #444;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    pointer-events: none;
    transition: opacity .3s;
  }

  .drop-hint .icon { font-size: 2.2rem; }
  .post-area.has-image .drop-hint { opacity: 0; }

  .overlay-text {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 28px 14px 14px;
    background: linear-gradient(to top, rgba(0,0,0,.85) 0%, transparent 100%);
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,.9);
    word-break: break-word;
    line-height: 1.35;
    pointer-events: none;
  }

  .overlay-text.hidden { display: none; }

  .nav-bar {
    background: #000;
    padding: 10px 0 14px;
    display: flex;
    justify-content: space-around;
    align-items: center;
  }

  /* ── Controls panel ── */
  .controls {
    width: 300px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }

  .card-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .upload-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }

  .upload-btn:hover {
    border-color: var(--accent);
    background: rgba(232,255,71,.04);
  }

  .upload-btn .icon { font-size: 1.2rem; }

  input[type="file"] {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
    top: 0; left: 0;
  }

  textarea {
    width: 100%;
    min-height: 80px;
    background: #1c1c1c;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    padding: 12px;
    resize: vertical;
    outline: none;
    transition: border-color .2s;
  }

  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: #444; }

  .style-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .style-pill {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: #aaa;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all .2s;
    font-family: 'DM Mono', monospace;
  }

  .style-pill.active, .style-pill:hover {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: 600;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
  }

  .slider-row label {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    white-space: nowrap;
  }

  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    height: 3px;
  }

  .slider-val {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    min-width: 28px;
    text-align: right;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: transform .15s, opacity .2s;
  }

  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    margin-top: 8px;
  }
  .btn:disabled { opacity: .35; cursor: default; }

  .post-area.drag-over { outline: 3px solid var(--accent); }

  /* loading overlay */
  #loadingOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.1em;
  }
  #loadingOverlay.active { display: flex; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #333;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <span>Exportiere …</span>
</div>

<h1>Story Editor</h1>
<p class="subtitle">Upload · Text · Export · Reset</p>

<div class="workspace">

  <!-- Phone mockup — this entire div gets captured -->
  <div class="phone" id="phoneMockup">

    <!-- Status bar -->
    <div class="phone-bar">
      <span>10:11 AM</span>
      <div style="display:flex;align-items:center;gap:5px">
        <!-- Signal bars -->
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none">
          <rect x="0" y="7" width="3" height="4" rx="0.6" fill="#ccc"/>
          <rect x="4.5" y="5" width="3" height="6" rx="0.6" fill="#ccc"/>
          <rect x="9" y="2.5" width="3" height="8.5" rx="0.6" fill="#ccc"/>
          <rect x="13.5" y="0" width="2.5" height="11" rx="0.6" fill="#ccc"/>
        </svg>
        <!-- Wifi -->
        <svg width="14" height="11" viewBox="0 0 14 11" fill="none">
          <path d="M7 8.5a1.2 1.2 0 110 2.4A1.2 1.2 0 017 8.5z" fill="#ccc"/>
          <path d="M4.2 6.5C4.9 5.7 5.9 5.2 7 5.2s2.1.5 2.8 1.3" stroke="#ccc" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M2 4.3C3.2 3 4.9 2.2 7 2.2s3.8.8 5 2.1" stroke="#ccc" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M0 2.1C1.6 0.8 4.1 0 7 0s5.4.8 7 2.1" stroke="#ccc" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        </svg>
        <!-- Battery -->
        <svg width="24" height="12" viewBox="0 0 24 12" fill="none">
          <rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="#ccc" stroke-opacity="0.6"/>
          <rect x="2" y="2" width="15" height="8" rx="1.5" fill="#ccc"/>
          <path d="M22 4v4c1-.4 1.5-1.2 1.5-2s-.5-1.6-1.5-2z" fill="#ccc" fill-opacity="0.5"/>
        </svg>
      </div>
    </div>

    <!-- Instagram header -->
    <div class="insta-header">
      <span class="insta-logo">Instagram</span>
      <div class="insta-icons">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </div>
    </div>

    <!-- Story strip -->
    <div class="story-strip">
      <div class="avatar-wrap">
        <div style="width:52px;height:52px;border-radius:50%;background:#222;border:2px solid #555;display:flex;align-items:center;justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </div>
        <span style="font-size:0.5rem;color:#888;margin-top:2px">Deine Story</span>
      </div>
    </div>

    <!-- Highlights -->
    <div class="highlights-strip">
      <div class="hl-label">Highlights</div>
      <div class="hl-circles">
        <div class="hl-circle"></div>
        <div class="hl-circle"></div>
        <div class="hl-circle"></div>
        <div class="hl-circle"></div>
      </div>
    </div>

    <!-- Post image area -->
    <div class="post-area" id="postArea"
         ondragover="handleDragOver(event)"
         ondragleave="handleDragLeave(event)"
         ondrop="handleDrop(event)">
      <img id="previewImg" src="" alt="" style="display:none" crossorigin="anonymous" />
      <div class="drop-hint" id="dropHint">
        <span class="icon">📷</span>
        <span>Foto hochladen</span>
        <span style="font-size:.6rem;color:#333">oder hierher ziehen</span>
      </div>
      <div class="overlay-text hidden" id="overlayText"></div>
    </div>

    <!-- Nav bar -->
    <div class="nav-bar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H5a1 1 0 01-1-1V9.5z"/>
        <path d="M9 21V12h6v9"/>
      </svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="16.5" y1="16.5" x2="21" y2="21"/>
      </svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
        <rect x="3" y="3" width="18" height="18" rx="4"/>
        <line x1="12" y1="8" x2="12" y2="16"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
      </svg>
      <div style="width:22px;height:22px;border-radius:50%;background:#555;border:1.5px solid #888;"></div>
    </div>

  </div><!-- end .phone -->

  <!-- Controls -->
  <div class="controls">

    <div class="card" style="position:relative">
      <div class="card-label">01 — Foto</div>
      <label class="upload-btn" for="fileInput">
        <span class="icon">📁</span>
        <span id="uploadLabel">Bild auswählen</span>
        <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this.files[0])">
      </label>
    </div>

    <div class="card">
      <div class="card-label">02 — Text</div>
      <textarea id="textInput" placeholder="Dein Text hier …" oninput="updateOverlay()"></textarea>

      <div class="style-row">
        <button class="style-pill active" onclick="setStyle(this,'white')">Weiß</button>
        <button class="style-pill" onclick="setStyle(this,'#e8ff47')">Gelb</button>
        <button class="style-pill" onclick="setStyle(this,'#ff5e5e')">Rot</button>
        <button class="style-pill" onclick="setStyle(this,'#5edfff')">Blau</button>
      </div>

      <div class="slider-row">
        <label>Größe</label>
        <input type="range" id="fontSize" min="10" max="36" value="17" oninput="updateFontSize(this.value)">
        <span class="slider-val" id="fontSizeVal">17</span>
      </div>
    </div>

    <div class="card">
      <div class="card-label">03 — Export & Reset</div>
      <button class="btn btn-primary" id="downloadBtn" onclick="downloadMockup()" disabled>
        ↓ Als PNG speichern
      </button>
      <button class="btn btn-secondary" onclick="resetAll()">
        ↺ Zurücksetzen
      </button>
    </div>

  </div>
</div>

<script>
  let currentColor = '#ffffff';
  let loadedImage = null;

  document.getElementById('postArea').addEventListener('click', function() {
    if (!loadedImage) document.getElementById('fileInput').click();
  });

  function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById('previewImg');
      img.src = e.target.result;
      img.style.display = 'block';
      const area = document.getElementById('postArea');
      area.classList.add('has-image');
      area.onclick = null;
      document.getElementById('uploadLabel').textContent = file.name.length > 22
        ? file.name.slice(0,20) + '…' : file.name;
      document.getElementById('downloadBtn').disabled = false;
      loadedImage = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function handleDragOver(e) {
    e.preventDefault();
    document.getElementById('postArea').classList.add('drag-over');
  }

  function handleDragLeave() {
    document.getElementById('postArea').classList.remove('drag-over');
  }

  function handleDrop(e) {
    e.preventDefault();
    document.getElementById('postArea').classList.remove('drag-over');
    handleFile(e.dataTransfer.files[0]);
  }

  function updateOverlay() {
    const val = document.getElementById('textInput').value.trim();
    const el = document.getElementById('overlayText');
    el.textContent = val;
    el.classList.toggle('hidden', val === '');
  }

  function setStyle(btn, color) {
    document.querySelectorAll('.style-pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    currentColor = color;
    document.getElementById('overlayText').style.color = color;
    document.getElementById('overlayText').style.textShadow =
      color === '#ffffff'
        ? '0 1px 6px rgba(0,0,0,.95)'
        : '0 1px 6px rgba(0,0,0,.7)';
  }

  function updateFontSize(val) {
    document.getElementById('fontSizeVal').textContent = val;
    document.getElementById('overlayText').style.fontSize = val + 'px';
  }

  async function downloadMockup() {
    if (!loadedImage) return;

    const overlay = document.getElementById('loadingOverlay');
    overlay.classList.add('active');

    try {
      const phone = document.getElementById('phoneMockup');

      const canvas = await html2canvas(phone, {
        scale: 3,           // 3× for crisp high-res output
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#000000',
        logging: false,
        imageTimeout: 15000,
      });

      const a = document.createElement('a');
      a.download = 'instagram_mockup_' + Date.now() + '.png';
      a.href = canvas.toDataURL('image/png');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } catch (err) {
      alert('Export fehlgeschlagen: ' + err.message);
      console.error(err);
    } finally {
      overlay.classList.remove('active');
    }
  }

  function resetAll() {
    const img = document.getElementById('previewImg');
    img.src = ''; img.style.display = 'none';
    const area = document.getElementById('postArea');
    area.classList.remove('has-image');
    area.onclick = () => { if (!loadedImage) document.getElementById('fileInput').click(); };
    loadedImage = null;
    document.getElementById('uploadLabel').textContent = 'Bild auswählen';
    document.getElementById('fileInput').value = '';

    document.getElementById('textInput').value = '';
    document.getElementById('overlayText').textContent = '';
    document.getElementById('overlayText').classList.add('hidden');

    document.querySelectorAll('.style-pill').forEach((p,i) => p.classList.toggle('active', i===0));
    currentColor = '#ffffff';
    document.getElementById('overlayText').style.color = '#fff';
    document.getElementById('fontSize').value = 17;
    document.getElementById('fontSizeVal').textContent = 17;
    document.getElementById('overlayText').style.fontSize = '17px';

    document.getElementById('downloadBtn').disabled = true;
  }
</script>
</body>
</html>
